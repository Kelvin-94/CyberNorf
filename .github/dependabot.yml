version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.x peers on typescript ^5, so the updater cannot
      # resolve a TypeScript 7 tree and fails the whole job. Revisit when
      # typescript-eslint ships TypeScript 7 support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # The runtime is Node 24 (CI and the deploy image), so the type package
      # must stay on the same major: @types/node 26 describes APIs that Node 24
      # does not provide. Move both together when the runtime is upgraded.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
