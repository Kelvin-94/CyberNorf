name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application foundation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cybernorf:cybernorf@localhost:5432/cybernorf?schema=public
      # Build-time placeholder: authentication secrets are injected by the
      # deployment platform, never committed or reused across environments.
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment
      BETTER_AUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cybernorf
          POSTGRES_PASSWORD: cybernorf
          POSTGRES_DB: cybernorf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybernorf -d cybernorf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Zero-tolerance gate: any advisory, including low severity, fails the
      # build. A gate at "high" let the minimatch advisory ship silently.
      - run: npm audit --audit-level=low
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate the production compose stack
        # Static validation only: no images are built or started. It catches a
        # broken stack file before a deployment host does.
        env:
          CYBERNORF_DOMAIN: cybernorf.example.com
          ACME_EMAIL: ops@example.com
          BETTER_AUTH_URL: https://cybernorf.example.com
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment
          POSTGRES_DB: cybernorf
          POSTGRES_USER: cybernorf
          POSTGRES_PASSWORD: ci-placeholder-password
          DATABASE_URL: postgresql://cybernorf:ci-placeholder-password@database:5432/cybernorf?schema=public&sslmode=verify-full&sslrootcert=/etc/cybernorf/database-tls/server.crt
        run: docker compose -f compose.prod.yaml config --quiet
      - name: Apply migrations to the primary database
        run: npm run db:migrate:deploy
      - name: Create the isolated test database
        run: psql -h localhost -U cybernorf -d cybernorf -c 'CREATE DATABASE cybernorf_test;'
        env:
          PGPASSWORD: cybernorf
      - name: Run unit and database-backed tests
        env:
          DATABASE_URL: postgresql://cybernorf:cybernorf@localhost:5432/cybernorf_test?schema=public
          NODE_ENV: test
        run: npm run test:db:prepare && npm test
      - run: npm run build

  runtime-audit:
    name: Runtime audit against a live server
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: postgresql://cybernorf:cybernorf@localhost:5432/cybernorf?schema=public
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-deployment
      BETTER_AUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cybernorf
          POSTGRES_PASSWORD: cybernorf
          POSTGRES_DB: cybernorf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybernorf -d cybernorf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate:deploy
      - run: npm run build
      - name: Start the application server
        run: |
          npm run start -- --port 3000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      # Exercises the deployed behavior end to end: CSRF, tenant isolation, error
      # shapes, rate limits, audit chain integrity, and page rendering.
      - run: npm run audit:runtime
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-log
          path: ${{ runner.temp }}/server.log

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pinned CLI is used instead of the action wrapper so the scan stays
      # read-only: it needs no GitHub API scope beyond the checkout it already has.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan committed history for secrets
        run: gitleaks git --no-banner --redact --exit-code 1 .
